<div (mouseover)="hideButton=false" (mouseout)="hideButton=true" cdkDrag>
  <div align="end" style="height: 30px;">
    <button mat-icon-button class="m-0 btn" [hidden]="hideButton" cdkDragHandle style="cursor: move;">
      <mat-icon>open_with</mat-icon>
    </button>
    <button mat-icon-button class="m-0 btn" [hidden]="hideButton" (click)="onDelete()">
      <mat-icon>delete</mat-icon>
    </button>
  </div>

  <mat-form-field appearance="fill" [class]="field.classes.field" [style]="field.styles">
      <mat-label>{{field.label}}</mat-label>
      <textarea matInput [placeholder]="field.placeholder" (input)="onValueChange($event)" [formControl]="control" [rows]="field.rows"></textarea>
      <mat-hint>{{field.hint}}</mat-hint>
      <mat-error *ngIf="control.invalid">{{field.errorMessages.required}}</mat-error>
  </mat-form-field>
</div>
